name: YORI AUTO CODING

on:
  repository_dispatch:
    types: [YORI COMMAND]

permissions:
  contents: write

jobs:
  process-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse Command and Create File/Folder
        run: |
          FULL_TEXT="${{ github.event.client_payload.text }}"
          TARGET_NAME=$(echo "$FULL_TEXT" | awk '{print $2}')
          
          if [ -z "$TARGET_NAME" ]; then
            TARGET_NAME="Yori-Funidare.txt"
          fi

          echo "Perintah dari Telegram: $FULL_TEXT"
          echo "Target yang akan dibuat: $TARGET_NAME"

          mkdir -p $(dirname "$TARGET_NAME")
          echo "Dibuat secara otomatis oleh YORI AUTO CODING pada $(date)" > "$TARGET_NAME"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Telegram Bot Action"
          git config --global user.email "bot@users.noreply.github.com"
          
          git add .
          git status
          
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan file."
          else
            git commit -m "Auto: Create file from Telegram command [skip ci]"
            git push
          fi
