<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yori AI Coder - Chat Mode</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #161b22;
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
            text-align: center;
        }
        header h1 {
            font-size: 1.2rem;
            color: #58a6ff;
        }
        header p {
            font-size: 0.75rem;
            color: #8b949e;
        }
        /* Area Chat Container */
        #chatContainer {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #1f6feb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            width: 100%;
            max-width: 100%;
        }
        .ai-message pre {
            background-color: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            margin-top: 8px;
            overflow-x: auto;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.82rem;
            color: #7ee787;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .ai-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.75rem;
            color: #8b949e;
        }
        .copy-btn {
            background: #30363d;
            color: #c9d1d9;
            border: none;
            padding: 3px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .copy-btn:hover {
            background: #484f58;
        }
        /* Input Area bawah */
        .input-area {
            background-color: #161b22;
            padding: 12px 16px;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            padding: 10px;
            font-size: 0.9rem;
            resize: none;
            height: 45px;
            max-height: 120px;
            outline: none;
        }
        textarea:focus {
            border-color: #58a6ff;
        }
        button#sendBtn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            height: 45px;
            transition: background 0.2s;
        }
        button#sendBtn:hover {
            background-color: #2ea043;
        }
        button#sendBtn:disabled {
            background-color: #21262d;
            color: #484f58;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <h1>Yori AI Coder</h1>
        <p>Chat Mode Interaktif</p>
    </header>

    <!-- Tempat Riwayat Chat Muncul -->
    <div id="chatContainer">
        <div class="message ai-message">
            Halo Yori! Ada yang bisa kubantu koding hari ini? Tuliskan saja instruksimu di bawah.
        </div>
    </div>

    <!-- Kotak Input Pesan -->
    <div class="input-area">
        <textarea id="promptInput" placeholder="Ketik instruksi koding di sini..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
        <button id="sendBtn" onclick="sendMessage()">Kirim</button>
    </div>

    <script>
        // Pecahan API Key supaya aman dari scanner publik GitHub
        const P1 = "AQ.Ab8RN6J";
        const P2 = "Fy1YqUbZY-zqN";
        const P3 = "0AVKIST_";
        const P4 = "W4WKn9pDKqZezTEwGgS1Yg";
        const API_KEY = P1 + P2 + P3 + P4;

        async function sendMessage() {
            const promptInput = document.getElementById("promptInput");
            const chatContainer = document.getElementById("chatContainer");
            const sendBtn = document.getElementById("sendBtn");
            const text = promptInput.value.trim();

            if (!text) return;

            // 1. Tampilkan pesan user ke chat
            appendMessage(text, 'user-message');
            promptInput.value = "";
            promptInput.style.height = "45px"; // Reset tinggi textarea

            // 2. Buat gelembung loading untuk AI
            const loadingId = "loading_" + Date.now();
            appendMessage("Sedang meracik kode...", 'ai-message', loadingId, true);

            sendBtn.disabled = true;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${API_KEY}`;
            
            const payload = {
                contents: [{
                    parts: [{
                        text: `Tuliskan HANYA kode murni (clean code) berdasarkan instruksi berikut: '${text}'. Jangan berikan teks basa-basi atau penjelasan di luar kode. Berikan kodenya secara lengkap.`
                    }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                const loadingBubble = document.getElementById(loadingId);

                if (data.candidates && data.candidates[0].content) {
                    let aiText = data.candidates[0].content.parts[0].text;
                    
                    if (aiText.startsWith("```")) {
                        const lines = aiText.split("\n");
                        lines.shift();
                        if (lines[lines.length - 1].trim() === "```") {
                            lines.pop();
                        }
                        aiText = lines.join("\n");
                    }

                    // Ubah bubble loading jadi hasil kode interaktif
                    updateAiMessage(loadingBubble, aiText.trim());
                } else {
                    loadingBubble.innerHTML = "Gagal mendapatkan respons dari API:\n" + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                console.error(error);
                const loadingBubble = document.getElementById(loadingId);
                loadingBubble.innerHTML = "Error Koneksi: " + error.message;
            } finally {
                sendBtn.disabled = false;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function appendMessage(text, className, id = "", isLoading = false) {
            const chatContainer = document.getElementById("chatContainer");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${className}`;
            if (id) messageDiv.id = id;

            if (className === 'user-message') {
                messageDiv.innerText = text;
            } else {
                if (isLoading) {
                    messageDiv.innerText = text;
                } else {
                    buildAiContent(messageDiv, text);
                }
            }

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function updateAiMessage(element, codeText) {
            element.innerHTML = "";
            buildAiContent(element, codeText);
        }

        function buildAiContent(container, codeText) {
            const headerBar = document.createElement("div");
            headerBar.className = "ai-header-bar";
            headerBar.innerHTML = `<span>Hasil Kode AI</span>`;

            const copyBtn = document.createElement("button");
            copyBtn.className = "copy-btn";
            copyBtn.innerText = "Salin";
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(codeText).then(() => {
                    alert("Kode berhasil disalin!");
                });
            };
            headerBar.appendChild(copyBtn);

            const pre = document.createElement("pre");
            pre.innerText = codeText;

            container.appendChild(headerBar);
            container.appendChild(pre);
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
</html>
