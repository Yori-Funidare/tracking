<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YF AI Background Remover - Offline</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Memuat Library AI Client-Side untuk Background Removal yang Rapi -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/bundle.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 12px;
        }

        .panel-header h2 {
            font-size: 1.15rem;
            color: #f9fafb;
            font-weight: 700;
        }

        .brand-badge {
            background-color: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
        }

        .upload-area {
            border: 2px dashed #374151;
            border-radius: 12px;
            padding: 24px 20px;
            text-align: center;
            background: #0b0f19;
            margin-bottom: 16px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .upload-area:hover {
            border-color: #38bdf8;
        }

        .upload-area input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-container {
            width: 100%;
            max-height: 220px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 16px;
            display: none;
            /* Pola kotak-kotak catur transparan */
            background-color: #1f2937;
            background-image: linear-gradient(45deg, #374151 25%, transparent 25%), 
                              linear-gradient(-45deg, #374151 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #374151 75%), 
                              linear-gradient(-45deg, transparent 75%, #374151 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            text-align: center;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 220px;
            object-fit: contain;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: transform 0.1s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            background: #374151;
            color: #6b7280;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status-text {
            margin-top: 12px;
            text-align: center;
            font-size: 0.82rem;
            color: #38bdf8;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="card">
            <div class="panel-header">
                <h2>🧠 YF AI BG Remover</h2>
                <span class="brand-badge">Client-Side AI</span>
            </div>

            <div class="upload-area">
                <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
                <div id="uploadPrompt">
                    <span style="font-size: 28px;">🪄</span>
                    <p style="font-size: 0.85rem; color: #9ca3af; margin-top: 6px;">Pilih foto untuk dihapus background-nya</p>
                </div>
            </div>

            <div class="preview-container" id="previewContainer">
                <img id="imagePreview" alt="Preview">
            </div>

            <button onclick="removeBackgroundAI()" id="actionBtn" class="btn-primary" disabled>Hapus Background dengan AI</button>
            <div id="statusMessage" class="status-text"></div>
        </div>

        <div class="footer">
            <p>&copy; 2026 Yori Funidare. All rights reserved.</p>
        </div>
    </div>

    <script>
        let selectedFile = null;

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('uploadPrompt').innerHTML = `<span style="font-size: 20px;">✅</span><p style="font-size: 0.82rem; color: #4ade80; margin-top: 4px;">${file.name}</p>`;
                    document.getElementById('previewContainer').style.display = 'block';
                    document.getElementById('actionBtn').disabled = false;
                    document.getElementById('statusMessage').innerText = "✨ Foto siap diproses AI.";
                }
                reader.readAsDataURL(file);
            }
        }

        async function removeBackgroundAI() {
            if (!selectedFile) return;

            const statusBox = document.getElementById('statusMessage');
            const actionBtn = document.getElementById('actionBtn');
            const imgElement = document.getElementById('imagePreview');

            actionBtn.disabled = true;
            actionBtn.innerText = "Memproses AI...";
            statusBox.style.color = "#38bdf8";
            statusBox.innerText = "⏳ Sedang memuat model AI & membersihkan background...";

            try {
                // Memanggil library imgly background removal langsung di browser secara lokal
                const blob = await imglyRemoveBackground(selectedFile, {
                    progress: (key, current, total) => {
                        if (total) {
                            let percent = Math.round((current / total) * 100);
                            statusBox.innerText = `⏳ AI Berjalan: ${percent}% (${key})`;
                        }
                    }
                });

                // Ubah hasil blob transparan menjadi URL objek untuk preview
                const url = URL.createObjectURL(blob);
                imgElement.src = url;

                statusBox.style.color = "#4ade80";
                statusBox.innerText = "✨ Sukses! Background bersih & rapi.";
                actionBtn.innerText = "Selesai";
                actionBtn.disabled = false;

            } catch (error) {
                console.error(error);
                statusBox.style.color = "#f87171";
                statusBox.innerText = "❌ Gagal memproses AI. Pastikan koneksi internet stabil (di awal unduh model).";
                actionBtn.disabled = false;
                actionBtn.innerText = "Coba Lagi";
            }
        }
    </script>
</body>
</html>
